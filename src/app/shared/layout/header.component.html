<header class="site-header" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <div class="container bar">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="mark">MC</span>
      <span class="name">My Choice <em>Interior</em></span>
    </a>

    <nav class="nav-desktop" aria-label="Main navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          >{{ link.label }}</a
        >
      }
    </nav>

    <div class="actions">
      <a [href]="'tel:' + site.phone.replaceAll(' ', '')" class="call" aria-label="Call us">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
        </svg>
        <span>{{ site.phone }}</span>
      </a>
      <a routerLink="/contact" class="btn btn-primary desktop-cta">Free Consultation</a>
      <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <button class="nav-backdrop" (click)="closeMenu()" aria-label="Close menu"></button>
  <nav class="nav-mobile show" aria-label="Main navigation">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        (click)="closeMenu()"
        >{{ link.label }}</a
      >
    }
    <a [href]="'tel:' + site.phone.replaceAll(' ', '')" class="nav-phone" (click)="closeMenu()">
      {{ site.phone }}
    </a>
    <a routerLink="/contact" class="btn btn-primary nav-cta" (click)="closeMenu()">Free Consultation</a>
  </nav>
}

<div class="header-spacer"></div>
